<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  /* Source for static/og.png — render with tools/make-og.sh, do not hand-edit the PNG.
     Tokens mirror sass/style.scss so the card matches the site. */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 630px; }

  body {
    background: #0a0c0d;
    color: #e4eae9;
    font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 76px 84px;
  }

  .brand {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: #fff;
  }
  .brand i { color: #eee; font-style: normal; }

  .title {
    font-size: 68px;
    font-weight: 500;
    line-height: 1.14;
    letter-spacing: -0.05em;
    color: #fff;
    max-width: 17ch;
  }

  .lede {
    margin-top: 28px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 25px;
    line-height: 1.5;
    color: #8d9b99;
    max-width: 48ch;
  }

  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 30px;
    border-top: 1px solid rgba(255, 255, 255, 0.09);
    font-size: 21px;
    color: #5a6968;
  }
  .foot .left { display: flex; align-items: center; gap: 14px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #5a6968; }
</style>
</head>
<body>
  <div class="brand">ivx<i>/</i>ai</div>

  <div>
    <div class="title">A chat client that runs entirely in your browser.</div>
    <div class="lede">No backend. No accounts. No analytics. No telemetry.</div>
  </div>

  <div class="foot">
    <span class="left"><span class="dot"></span>Free and Open Source</span>
    <span>ai.ivx.run</span>
  </div>
</body>
</html>
