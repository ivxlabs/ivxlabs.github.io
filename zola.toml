# The URL the site will be built for
base_url = "https://ai.ivx.run"

title = "ivx/ai Chat"
description = "A lightweight, browser-based chat client designed for users who want total control over their data and their AI interactions."

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

[markdown]

# Docs contain plain commands, not syntax-highlighted source. Highlighting
# injects inline background colours that fight the monochrome palette.
[markdown.highlighting]
style = "class"
theme = "catppuccin-mocha"

[extra]
# Put all your custom variables here
